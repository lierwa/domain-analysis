inclusion_rules:
  - 厂商型号必须由监管备案、品牌官方目录/说明书或已核实官方销售入口提供身份依据。
  - 当前在售必须由同一快照窗口内的品牌官方商城、平台自营或核实后的官方旗舰店提供证据。
  - 旗舰店名称不能单独作为官方证据；需品牌官网反链、平台资质或有效授权证据。
exclusion_rules:
  - 普通第三方、小型商家、未核实旗舰店和聚合转载页面不进入官方在售总体。
  - 页面、卖家、颜色、促销或价格变化不产生新的厂商型号。
  - 只有历史备案而无当前官方在售证据的型号不进入官方在售分母。
