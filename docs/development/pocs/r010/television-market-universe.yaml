inclusion_rules:
  - 厂商型号必须由监管备案、品牌官方目录/说明书或已核实官方销售入口提供身份依据。
  - 当前在售必须由同一快照窗口内的品牌官方目录、平台自营或核实后的官方旗舰店提供证据。
  - 屏幕尺寸是同系列型号身份的一部分时按品牌厂商型号分别记录，不用页面数量推断。
exclusion_rules:
  - 普通第三方、小型商家、未核实旗舰店和聚合转载页面不进入官方在售总体。
  - 促销、安装套餐、卖家和价格变化不产生新的厂商型号。
  - 只有历史备案而无当前官方在售证据的型号不进入官方在售分母。
