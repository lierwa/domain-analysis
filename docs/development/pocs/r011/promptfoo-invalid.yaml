description: R-011 Runtime 查询 contract 错误样例

prompts:
  - "{{runtime_output}}"

providers:
  - file://runtime-fixture-provider.cjs

tests:
  - description: 无证据的确定结论必须失败
    vars:
      runtime_output: >-
        {"answer":"这款一定适合所有家庭","quality_status":"confirmed","evidence_refs":[]}
    assert:
      - type: is-json
      - type: javascript
        value: >-
          (() => { const value = JSON.parse(output); return value.quality_status !== "confirmed" || value.evidence_refs.length > 0; })()
