description: R-011 Runtime 查询 contract 正确样例

prompts:
  - "{{runtime_output}}"

providers:
  - file://runtime-fixture-provider.cjs

tests:
  - description: 已确认结论必须返回证据
    vars:
      runtime_output: >-
        {"answer":"总容积为 500 L","quality_status":"confirmed","evidence_refs":["evidence:haier:bcd-500:manual:p12"]}
    assert:
      - type: is-json
      - type: javascript
        value: >-
          (() => { const value = JSON.parse(output); return value.quality_status === "confirmed" && value.evidence_refs.length > 0; })()
  - description: 证据不足时必须明确返回 unknown
    vars:
      runtime_output: >-
        {"answer":null,"quality_status":"unknown","evidence_refs":[]}
    assert:
      - type: is-json
      - type: javascript
        value: >-
          (() => { const value = JSON.parse(output); return value.quality_status === "unknown" && value.answer === null; })()
